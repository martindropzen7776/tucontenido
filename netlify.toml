# Next.js 16 con App Router.
# Este archivo pisa lo que esté configurado en la UI de Netlify:
# si quedó un comando o un publish directory de la versión anterior
# en HTML plano, acá se anula.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# El plugin oficial es lo que hace que Next funcione en Netlify.
# Se declara explícito en vez de confiar en la autodetección.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Cabeceras ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Las fuentes y los assets con hash en el nombre se cachean para siempre.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
