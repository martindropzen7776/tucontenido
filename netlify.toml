# El sitio se exporta estático: `next build` produce la carpeta out/
# con HTML plano. No hace falta el plugin de Next ni ningún runtime.
#
# Este archivo pisa lo que esté configurado en la UI de Netlify.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# /web fue la landing de webs (hasta el 17/09/2026 ahí, después en la
# raíz). Desde el 13/11/2026 la raíz es la agencia de Meta y Google y
# las webs ya no se venden: los links viejos caen en la raíz.
[[redirects]]
  from = "/web"
  to = "/"
  status = 301

[[redirects]]
  from = "/web/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
